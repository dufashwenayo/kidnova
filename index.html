/* ---------- 20. Daily attendance register, history and summaries ---------- */
function defaultAttDate() {
  let d = todayISO();
  while (!isWeekday(d)) d = addDays(d, -1);
  return d;
}
function buildAttDraft(classId, date, blank = false) {
  const draft = {};
  studentsIn(classId).forEach(st => {
    if (st.admissionDate > date) return;
    const rec = db.attendance.find(a => a.studentId === st.id && a.date === date);
    draft[st.id] = { status: rec ? rec.status : (blank ? null : 'Present'), reason: rec ? rec.reason || '' : '' };
  });
  return draft;
}
function rateFromRecords(list) {
  const cats = settingsOf().attendanceCategories;
  let attended = 0, absent = 0;
  list.forEach(r => {
    const c = cats.find(x => x.key === r.status);
    if (!c) return;
    if (c.attended === true) attended += 1;
    else if (c.attended === false) absent += 1;
  });
  return { attended, absent, rate: ratio(attended, attended + absent) };
}
function upsertAttendance(studentId, classId, date, status, reason, term, year) {
  const rec = db.attendance.find(a => a.studentId === studentId && a.date === date);
  if (rec) Object.assign(rec, { classId, termId: term.id, yearId: year.id, status, reason });
  else db.attendance.push({ id: uid('att'), schoolId: sid(), yearId: year.id, termId: term.id, classId, studentId, date, status, reason });
}

  }).join('');
  return `<div class="grid g2"><div class="card"><div class="card-h"><div><h3>Monthly summary</h3><p>Attendance rate by calendar month for this class</p></div></div><div class="card-b">${monthly || emptyState('No data yet', 'Monthly summaries appear once registers are saved.')}</div></div>
    <div class="card"><div class="card-h"><div><h3>Termly summary by learner</h3><p>Flags learners below the attendance threshold in Settings → Report card</p></div></div><div class="table-wrap mt"><table class="tbl"><thead><tr><th>Learner</th><th class="r">Days</th><th class="r">Attended</th><th class="r">Absent</th><th class="r">Excused</th><th class="r">Rate</th><th>Flag</th></tr></thead><tbody>${termly || '<tr><td colspan="7" class="muted">No learners.</td></tr>'}</tbody></table></div></div></div>`;

  if (missing.length) throw new AppError(`Tick every learner first. Not ticked yet: ${missing.slice(0, 4).join(', ')}${missing.length > 4 ? ` and ${missing.length - 4} more` : ''}.`);

/* School-day helpers for the date picker */
const prevSchoolDay = d => { let x = addDays(d, -1); while (!isWeekday(x)) x = addDays(x, -1); return x; };
const nextSchoolDay = d => { let x = addDays(d, 1); while (!isWeekday(x)) x = addDays(x, 1); return x; };
const longDate = d => parseISO(d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
/* Phone helpers for calling parents of absent learners */
const telOf = ph => String(ph || '').replace(/[^\d+]/g, '');
const waOf = ph => { let d = String(ph || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '250' + d.slice(1); if (d.length === 9) d = '250' + d; return d; };
/* Classes of this teacher whose register for today (a school day in term) is not saved yet. */
function registersMissingToday(classes) {
  const tm = activeTerm(), today = todayISO();
  if (!tm || !isWeekday(today) || today < tm.openDate || today > tm.closeDate) return [];
  return classes.filter(cl => studentsIn(cl.id).length && !db.attendance.some(a => a.classId === cl.id && a.date === today));
}

const DISC_TYPES = [
  ['positive', 'Positive behaviour', '#21a04a', '👍'],
  ['minor', 'Minor concern', '#f3a712', '⚠️'],
  ['serious', 'Serious concern', '#e2472f', '⛔'],
];
const DISC_TYPE = Object.fromEntries(DISC_TYPES.map(t => [t[0], { label: t[1], color: t[2], ico: t[3] }]));
const DISC_CATS = {
  positive: ['Helping others', 'Sharing and taking turns', 'Good manners', 'Following instructions', 'Kindness to classmates', 'Tidying up', 'Other'],
  minor: ['Not listening', 'Disturbing the class', 'Refusing to share', 'Not tidying up', 'Rough play', 'Other'],
  serious: ['Hitting or biting', 'Bullying', 'Damaging property', 'Leaving class without permission', 'Bad language', 'Other'],
};
/* Conduct level for a term, from the record: no concerns = 95 (Excellent); concerns lower it. Counted on the report card. */
function conductFor(studentId, termId) {
  const recs = (db.discipline || []).filter(r => r.studentId === studentId && r.termId === termId);
  const positive = recs.filter(r => r.type === 'positive').length;
  const minor = recs.filter(r => r.type === 'minor').length;
  const serious = recs.filter(r => r.type === 'serious').length;
  const pct = serious >= 2 || minor >= 4 ? 65 : serious === 1 || minor >= 2 ? 75 : minor === 1 ? 85 : 95;
  const band = bandFor(pct);
  return { positive, minor, serious, percent: pct, code: band ? band.code : '', color: band ? band.color : '', label: band ? band.label : '' };
}
function discListHtml(list, canDelete) {

    const st = byId('students', r.studentId) || { fullName: '—' };

      <div class="disc-b"><strong>${esc(r.category)}</strong>${r.note ? ` — ${esc(r.note)}` : ''}${r.action ? `<span class="disc-act">Action taken: ${esc(r.action)}</span>` : ''}
      <span class="disc-meta">${r.type !== 'positive' ? (r.parentInformed ? '✓ Parent informed' : '<b>Parent not informed yet</b>') + ' · ' : ''}by ${esc(String(r.by || '—').split(' ').map(w => w.charAt(0) + w.slice(1).toLowerCase()).join(' '))}${canDelete ? ` · <button type="button" class="link" data-action="disc-delete" data-id="${esc(r.id)}">Delete</button>` : ''}</span></div></div>`;
  }).join('')}</div>`;
}

FORMS.area = (fd, arg) => {
  requireWritable();
  const existing = byId('learningAreas', arg);
  const classId = existing ? existing.classId : arg;
  const cls = byId('classes', classId);
  if (!cls) throw new AppError('Class not found.');
  const name = String(fd.get('name') || '').trim();
  if (!name) throw new AppError('Enter the subject name.');
  const groupSel = String(fd.get('groupSel') || '');
  const group = groupSel === '__new' ? String(fd.get('groupNew') || '').trim().toUpperCase() : groupSel;
  if (groupSel === '__new' && !group) throw new AppError('Type the name of the new category.');
  if (classAreas(classId).some(x => (!existing || x.id !== existing.id) && x.name.toLowerCase() === name.toLowerCase())) throw new AppError(`${cls.name} already has a learning area called ${name}.`);
  const used = existing ? db.assessments.some(x => x.areaId === existing.id) : false;
  const kind = 'competency';
  if (!['numerical', 'competency'].includes(kind)) throw new AppError('Choose an assessment type.');
  let maxMarks = 0;
  if (kind === 'numerical') {
    maxMarks = Number(fd.get('maxMarks'));
    if (!Number.isInteger(maxMarks) || maxMarks < 1 || maxMarks > 1000) throw new AppError('Maximum marks must be a whole number from 1 to 1000.');
    if (existing) {
      const ids = new Set(db.assessments.filter(x => x.areaId === existing.id).map(x => x.id));
      if (db.results.some(r => ids.has(r.assessmentId) && r.marks !== null && r.marks > maxMarks)) throw new AppError(`Some marks already exceed ${maxMarks}. Choose a higher maximum.`);
    }
  }
  if (existing) {
    Object.assign(existing, { name, kind, maxMarks, group });
    commit('Subject updated', `${name} · ${cls.name}`);
  } else {
    /* New subjects go to the end of their category so report headings stay together. */
    const place = cid => {
      const list = classAreas(cid);
      if (list.some(x => x.name.toLowerCase() === name.toLowerCase())) return false;
      const lastInCat = list.filter(x => (x.group || '') === group).pop();
      const at = lastInCat ? lastInCat.order + 0.5 : list.length + 1;
      db.learningAreas.push({ id: uid('la'), schoolId: sid(), classId: cid, name, kind, maxMarks, group, order: at });
      classAreas(cid).forEach((x, i) => { x.order = i + 1; });
      return true;
    };
    place(classId);
    let extra = 0;
    if (fd.get('allClasses') === '1') classList().forEach(c => { if (c.id !== classId && place(c.id)) extra += 1; });
    commit('Subject registered', `${name} · ${group || 'General'} · ${cls.name}${extra ? ` + ${extra} other class(es)` : ''}`);
  }
  ui.settingsClassId = classId;
  return true;
};

FORMS.grading = fd => {

    const min = Number(fd.get(`b_min_${i}`));
    const code = String(fd.get(`b_code_${i}`) || '').trim().toUpperCase();
    const label = String(fd.get(`b_label_${i}`) || '').trim();
    const remark = String(fd.get(`b_remark_${i}`) || '').trim();

    if (!Number.isInteger(min) || min < 0 || min > 100) throw new AppError('Each minimum must be a whole number from 0 to 100.');
    if (!code || !label || !remark) throw new AppError('Every band needs a code, a label and a remark.');
    bands.push({ min, code, label, remark, color });
  }
  const mins = bands.map(b => b.min);
  if (new Set(mins).size !== mins.length) throw new AppError('Each band needs a different minimum.');
  if (new Set(bands.map(b => b.code)).size !== bands.length) throw new AppError('Band codes must be different.');
  set.gradingBands = bands.sort((a, b) => b.min - a.min);
  set.gradingVersion = 3;
  commit('Grading rules updated', `${set.gradingBands.length} bands`);

function validateBackup(data) {
  if (!data || typeof data !== 'object' || data.version !== 1) throw new AppError('This file is not a backup from this system (version 1 expected).');
  if (!Array.isArray(data.schools)) throw new AppError('The backup has no school list.');
  COLLECTIONS.forEach(k => { if (data[k] !== undefined && !Array.isArray(data[k])) throw new AppError(`The backup field “${k}” is malformed.`); });
  data.schools.forEach(s => { if (!s || typeof s.id !== 'string' || typeof s.name !== 'string') throw new AppError('A school record in the backup is malformed.'); });
  const count = k => (Array.isArray(data[k]) ? data[k].length : 0);
  return `${count('schools')} school(s), ${count('students')} learner record(s), ${count('attendance')} attendance record(s), ${count('results')} result(s)`;
}

let authSlideTimer = null;
function showAuth(mode = 'signin', msg = '') {
  $('#app').hidden = true;
  if ($('#homeRoot')) $('#homeRoot').hidden = true;
  const root = $('#authRoot');
  root.hidden = false;
  root.innerHTML = authHtml(mode, msg);
  document.title = (mode === 'signup' ? 'Sign up' : 'Login') + ' · KIDNOVA';
  $$('[data-mode]', root).forEach(b => { b.onclick = () => showAuth(b.dataset.mode); });
  $('#authHelp').onclick = () => { const h = $('#authHelpBox'); h.hidden = !h.hidden; };
  if ($('#authForgot')) $('#authForgot').onclick = () => { const f = $('#authForgotBox'); f.hidden = !f.hidden; };
  $('#authEye').onclick = () => { const i = $('input[name=password]', root); i.type = i.type === 'password' ? 'text' : 'password'; };
  clearInterval(authSlideTimer);
  let k = 0;
  authSlideTimer = setInterval(() => {

    k = (k + 1) % AUTH_SLIDES.length;

    if (mode === 'signup' && !name) return showAuth(mode, 'Please enter your full name.');
    if (!isEmail(email)) return showAuth(mode, 'Please enter a valid email address.');
    if (password.length < 6) return showAuth(mode, 'Password must be at least 6 characters.');

    const res = mode === 'signup'
      ? await sb.auth.signUp({ email, password, options: { data: { full_name: name } } })

async function submitRegistration(token, form) {
  const msg = $('#regMsg');
  const fail = m => { msg.innerHTML = `<div class="banner bad"><span>${esc(m)}</span></div>`; msg.scrollIntoView({ behavior: 'smooth', block: 'center' }); btn.disabled = false; btn.textContent = 'Submit registration'; };
  const btn = $('.auth-submit', form);
  const fd = new FormData(form);
  let data, yearIn;
  try {
    data = readSchoolFields(fd);
    yearIn = { name: String(fd.get('yearName') || '').trim(), openDate: fd.get('yearOpen'), closeDate: fd.get('yearClose') };
  } catch (err) { return fail(err.message); }
  const email = String(fd.get('dirEmail') || '').trim().toLowerCase(), pass = String(fd.get('dirPass') || ''), pass2 = String(fd.get('dirPass2') || '');
  if (!isEmail(email)) return fail('Enter the director’s email address. It is required for school access.');
  if (pass.length < 6) return fail('The director password must be at least 6 characters.');
  if (pass !== pass2) return fail('The two passwords do not match.');
  btn.disabled = true; btn.textContent = 'Registering…';
  const existing = await sb.auth.getSession();
  if (existing.data && existing.data.session) await sb.auth.signOut();
  let res = await sb.auth.signUp({ email, password: pass, options: { data: { full_name: data.director } } });
  if (res.error && /already/i.test(res.error.message)) res = await sb.auth.signInWithPassword({ email, password: pass });
  if (res.error) return fail(/invalid login/i.test(res.error.message) ? 'This director email already has an account with a different password. Enter its correct password or use another email.' : res.error.message);
  if (!res.data.session) return fail('The director account could not be signed in. Please try again.');
  authUser = res.data.session.user;
  db = emptyDb();
  let schoolId;
  try { schoolId = buildSchool(data, yearIn, ui.pendingLogo || ''); logActivity('School registered', `${data.name} · director ${email}`); }
  catch (err) { return fail(err.message); }
  ui.pendingLogo = null;
  const { error } = await sb.rpc('kn_redeem_invite', { p_token: token, p_school_id: schoolId, p_school_name: data.name, p_reg: data.regNumber, p_director_email: email, p_data: db });
  if (error) { db = null; return fail(error.message); }
  history.replaceState(null, '', location.pathname + '#dashboard');
  toast('Registration submitted. KIDNOVA will review it shortly.', 'ok', 6000);
  await startApp(authUser);
}

  };
  step1();
}
async function startApp(user, opts = {}) {
  authUser = user;
  $('#authRoot').hidden = true;
  $('#app').hidden = false;
  $('#view').innerHTML = '<div class="card"><div class="empty-hero"><p class="muted">Loading your records…</p></div></div>';
  try {
    const { data: role, error } = await sb.rpc('kn_claim_super');
    if (error) throw new Error('Could not check your access: ' + error.message);
    myRole = role || null;
  } catch (e) { $('#view').innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; return; }
  if (myRole === 'suspended') { myRole = null; showNoAccess(true); return; }
  if (!myRole) { showNoAccess(); return; }
  try {
    const { data: me } = await sb.from('kn_members').select('school_id, features, teacher_id').eq('user_id', user.id).maybeSingle();
    mySchool = me ? me.school_id : null;
    myTeacherId = me ? me.teacher_id : null;
    myFeatures = me && Array.isArray(me.features) ? me.features : [];
    let target = mySchool;
    if (!isSuper()) {
      const { data: info } = await sb.rpc('kn_my_school_info');
      if (info && info.status !== 'approved') { showPending(info); return; }
    }
    if (isSuper()) {
      await loadWorkspaceList();
      /* Never open a school automatically: only the one chosen at login, or chosen earlier in this tab. */
      let chosen = null;
      if ('schoolId' in opts) chosen = opts.schoolId || null;
      else { try { chosen = sessionStorage.getItem('kn.ws'); } catch (e) { chosen = null; } }
      target = chosen && ws.list.some(w => w.school_id === chosen) ? chosen : null;
    }
    await openWorkspace(target);
  } catch (e) { $('#view').innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; return; }
  if (!started) {
    started = true;
    window.addEventListener('hashchange', () => { applyRoute(); render(); });
    $('#modalRoot').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modalRoot').hidden) closeModal(); });
  }
  ui.welcome = !!opts.welcome;
  if (opts.welcome) toast(`Welcome, ${currentAdmin().name.split(' ')[0].charAt(0) + currentAdmin().name.split(' ')[0].slice(1).toLowerCase()}! You are signed in as ${PROFILE_NAME[myRole] || myRole}.`, 'ok', 5000);
  if (setupNeeded() && (opts.welcome || !location.hash || location.hash === '#dashboard')) history.replaceState(null, '', location.pathname + '#setup');
  if (!location.hash || ['#register', '#login', '#home'].includes(location.hash)) history.replaceState(null, '', location.pathname + (curSchool() ? '#dashboard' : isSuper() ? '#schools' : '#dashboard'));
  applyRoute();
  render();
}
async function init() {
  if (!CONFIGURED) { showAuth('signin', 'KIDNOVA is not connected to its database yet. Sign-in will be available shortly.'); $('.auth-submit').disabled = true; return; }
  const hs = await sb.rpc('kn_has_super');
  if (hs.error) { showAuth('signin', 'The KIDNOVA database is not set up yet (run supabase.sql in the Supabase SQL editor). Details: ' + hs.error.message); $('.auth-submit').disabled = true; return; }
  authHasSuper = !!hs.data;
  const regToken = new URLSearchParams(location.search).get('register');
  if (regToken) {
    await showRegister(regToken);
    sb.auth.onAuthStateChange((event, session) => { if (session && authUser && session.user.id === authUser.id) authUser = session.user; });
    return;
  }
  const { data } = await sb.auth.getSession();
  if (data && data.session) await startApp(data.session.user);
  else {
    /* Visitors see the homepage; #login opens the login page. */
    const route = () => { if (started || authUser) return; if (location.hash === '#login' || !authHasSuper) showAuth(authHasSuper ? 'signin' : 'signup'); else showHome(); };
    window.addEventListener('hashchange', route);
    route();
  }
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT' && started) { location.replace(location.pathname + '#login'); location.reload(); }
    if (session && authUser && session.user.id === authUser.id) authUser = session.user;
  });
}
init();
</script>
