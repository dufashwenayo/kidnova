<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KIDNOVA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 40 40' aria-hidden='true'%3E%3Cdefs%3E%3ClinearGradient id='kgA' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231e88e5'/%3E%3Cstop offset='1' stop-color='%230b5aa0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='11' fill='url(%23kgA)'/%3E%3Cpath d='M20 7.5l2.9 8.1 8.6.3-6.8 5.3 2.4 8.3L20 24.6l-7.1 4.9 2.4-8.3-6.8-5.3 8.6-.3z' fill='%23fff'/%3E%3Ccircle cx='31' cy='9' r='2.4' fill='%23ffd166'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14305c; --navy-deep:#0b1d3a; --navy-2:#23508f;
  --blue:#8fc1ea; --blue-soft:#eaf4fd; --blue-line:#cfe4f7;
  --bg:#f3f5f9; --card:#ffffff; --line:#e1e7ef; --line-soft:#eef2f7;
  --ink:#18212f; --muted:#5d6b7f; --faint:#8a96a8;
  --ok:#17744a; --ok-bg:#e4f4eb; --warn:#8f5606; --warn-bg:#fcf0dc;
  --bad:#ad2727; --bad-bg:#fbe8e8; --info:#2a5d9b; --info-bg:#e5eefa;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
/* Display scale: 80% on computers (like browser zoom 80%), 100% on phones and in print.
   --vh100 is one full screen height expressed in zoomed units. */
:root{--z:1;--vh100:100vh}
@media (min-width:961px){
  :root{--z:.8;--vh100:calc(100vh / .8)}
  body{zoom:.8}
}
@media print{:root{--z:1;--vh100:100vh} body{zoom:1}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:var(--navy-2);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;color:var(--navy-deep);letter-spacing:-.01em}
h2{font-size:20px;font-weight:650}
h3{font-size:15px;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.mt{margin-top:16px}
.mb{margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grow{flex:1}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:var(--vh100)}
.sidebar{position:sticky;top:0;height:var(--vh100);overflow-y:auto;background:var(--navy);color:#cfdcec;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand-title{color:#fff;font-weight:650;font-size:14.5px;line-height:1.2}
.brand-sub{font-size:11.5px;color:#9db6d6;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px;padding:10px 10px 12px;flex:1}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#7f9bc2;padding:12px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#cfdcec;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff;text-decoration:none}
.nav a.on{background:#fff;color:var(--navy);font-weight:650}
.admin-card{margin:12px;padding:14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.admin-card .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#9db6d6}
.admin-card .n{color:#fff;font-weight:700;margin-top:4px;letter-spacing:.02em}
.admin-card .r{color:var(--blue);font-size:11.5px;font-weight:650;margin-top:2px}
.admin-card .e{color:#cfdcec;font-size:12px;margin-top:6px;word-break:break-all}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.menu-btn{display:none}
.school-chip{display:flex;align-items:center;gap:10px;min-width:0}
.school-chip strong{display:block;color:var(--navy-deep);font-size:14.5px}
.school-chip span{font-size:12px;color:var(--muted)}
.inline-lbl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.term-pill{display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--blue-line);background:var(--blue-soft);border-radius:999px}
.term-pill small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.term-pill strong{font-size:13px;color:var(--navy-deep)}
.term-pill.none{background:var(--warn-bg);border-color:#f2d9a8}
.banners{padding:0 28px}
.banners:empty{display:none}
.banner{margin-top:14px;padding:11px 14px;border-radius:10px;font-size:13px;border:1px solid transparent;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner.info{background:var(--info-bg);color:var(--info);border-color:#c9daf2}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:#f2d9a8}
.banner.bad{background:var(--bad-bg);color:var(--bad);border-color:#f0c4c4}
.view{padding:24px 28px 56px;min-width:0}
.scrim{display:none}

/* ---------- Page & cards ---------- */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{color:var(--muted);margin-top:4px}
.page-head .actions{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:12.5px;margin-top:2px}
.card-b{padding:16px 18px}
.card-b.flush{padding:0}
.card-f{padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.stat .val{font-size:26px;font-weight:700;color:var(--navy-deep);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--muted)}
.stat .track{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin-top:4px}
.stat .track i{display:block;height:100%;background:var(--navy-2);border-radius:99px}
.stat.accent{border-left:4px solid var(--navy-2)}
.stat.ok{border-left:4px solid var(--ok)}
.stat.warn{border-left:4px solid #c98a1b}
.stat.info{border-left:4px solid var(--blue)}

/* ---------- Buttons & badges ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--navy-deep);font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--line-soft);text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-deep)}
.btn.light{background:var(--blue-soft);border-color:var(--blue-line);color:var(--navy)}
.btn.light:hover{background:var(--blue-line)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger:hover{background:#8e1f1f}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.xs{padding:3px 8px;font-size:11.5px;border-radius:7px}
.btn.link,.link{background:none;border:0;padding:0;color:var(--navy-2);font-weight:600;text-decoration:underline;cursor:pointer}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;font-size:16px;color:var(--navy-deep)}
.icon-btn:hover{background:var(--line-soft)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;white-space:nowrap;background:#eef1f5;color:var(--muted)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.navy{background:var(--navy);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)}
.dot.warn{background:#c98a1b}
.dot.bad{background:var(--bad)}
.dot.info{background:var(--navy-2)}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border-top:1px solid var(--line-soft)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:#f7f9fc;color:var(--muted);font-weight:650;text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot th,.tbl tfoot td{background:#f7f9fc;font-weight:650;border-bottom:0}
.tbl tbody tr:hover td{background:#fafcff}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.c,.tbl th.c{text-align:center}
.tbl .sub{display:block;font-size:11.5px;color:var(--muted)}
.tbl input.input,.tbl select.input{padding:6px 8px}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--navy-deep);font-size:15px;margin-bottom:6px}
.empty .btn{margin-top:14px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field .lbl{font-size:12.5px;font-weight:600;color:var(--navy-deep)}
.field .hint{font-size:11.5px;color:var(--muted)}
.input{width:100%;padding:9px 11px;border:1px solid #cdd6e2;border-radius:9px;background:#fff;font-size:13.5px;min-width:0}
.input:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--navy-2)}
.input.sm{width:auto;padding:6px 9px;font-size:12.5px;border-radius:8px}
.input[disabled]{background:var(--line-soft);color:var(--muted)}
textarea.input{min-height:76px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid .span2{grid-column:1/-1}
.form-grid .span3{grid-column:1/-1}
.fieldset{border:1px solid var(--line);border-radius:10px;padding:14px;margin:0}
.fieldset legend{padding:0 6px;font-weight:650;color:var(--navy-deep);font-size:13px}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.check input{width:16px;height:16px;accent-color:var(--navy)}
.toolbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.toolbar .field{min-width:150px}
.toolbar .search{min-width:240px;flex:1}
.toolbar .field .lbl{font-size:11.5px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:1px solid #cdd6e2;border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid #cdd6e2}
.seg button:last-child{border-right:0}
.seg button.on{color:#fff}
.seg button:hover{background:var(--line-soft)}
.seg button.on:hover{filter:brightness(1.05)}

/* ---------- Modal & toasts ---------- */
.modal-root{position:fixed;inset:0;background:rgba(11,29,58,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(var(--vh100) * .06) 16px;z-index:100;overflow-y:auto}
.modal-root[hidden]{display:none}
.modal{background:#fff;border-radius:14px;width:min(640px,100%);box-shadow:0 20px 50px rgba(11,29,58,.25);display:flex;flex-direction:column;max-height:calc(var(--vh100) * .88)}
.modal.wide{width:min(900px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:16px}
.modal-form{display:flex;flex-direction:column;min-height:0;flex:1}
.modal-b{padding:18px 20px;overflow-y:auto;min-height:0}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.confirm-msg{font-size:14px;line-height:1.55}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:200;max-width:380px}
.toast{background:var(--navy-deep);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(11,29,58,.25);font-size:13px;transition:opacity .25s}
.toast.ok{background:var(--ok)}
.toast.bad{background:var(--bad)}
.toast.info{background:var(--navy-2)}
.toast.out{opacity:0}

/* ---------- Charts & visual helpers ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .val{font-size:11.5px;font-weight:650;color:var(--navy-deep);margin-bottom:4px;font-variant-numeric:tabular-nums}
.bars .fill{width:100%;max-width:44px;background:var(--navy-2);border-radius:6px 6px 0 0;min-height:2px}
.bars .fill.low{background:#d9a441}
.bars .fill.bad{background:var(--bad)}
.bars .lab{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 62px;align-items:center;gap:12px;padding:7px 0;font-size:13px}
.hbar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:10px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--navy-2);border-radius:99px}
.hbar .v{text-align:right;font-weight:650;font-variant-numeric:tabular-nums;color:var(--navy-deep)}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--line-soft)}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.progress{height:8px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--navy-2);border-radius:99px}
.progress.warn>span{background:#c98a1b}
.progress.bad>span{background:var(--bad)}
.logo,.avatar{display:inline-grid;place-items:center;overflow:hidden;flex:none;border-radius:10px;background:#fff;color:var(--navy);font-weight:800;border:1px solid var(--line)}
.logo{width:46px;height:46px;font-size:15px}
.logo.sm{width:36px;height:36px;font-size:12px;border-radius:9px}
.logo.lg{width:84px;height:84px;font-size:26px;border-radius:16px}
.logo.ph,.avatar.ph{background:var(--blue-soft);color:var(--navy)}
.logo img,.avatar img{width:100%;height:100%;object-fit:contain}
.avatar{width:36px;height:36px;font-size:12.5px;border-radius:50%}
.avatar.lg{width:84px;height:84px;font-size:26px;border-radius:14px}
.avatar img{object-fit:cover}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who strong{display:block;color:var(--navy-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:9px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:20px 22px;background:var(--navy);color:#dbe7f5;border-radius:var(--radius)}
.hero h2{color:#fff;font-size:22px}
.hero p{color:#b9cce6;font-size:13px;margin-top:4px}
.hero .logo{background:#fff;border-color:transparent}
.hero .pills{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.hero .pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 12px;font-size:12px;color:#dbe7f5}
.hero .pill strong{display:block;color:#fff;font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.tab:hover{color:var(--navy-deep)}
.split{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.subnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:90px}
.subnav button{text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;font-weight:600;color:var(--muted)}
.subnav button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow);border:1px solid var(--line)}
.subnav button:hover{color:var(--navy-deep)}
.checklist{display:flex;flex-direction:column;gap:8px}
.step-num{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:var(--navy);color:#fff;font-weight:700;font-size:12px;flex:none}
.empty-hero{text-align:center;padding:44px 24px}
.empty-hero .logo{margin:0 auto 14px;width:64px;height:64px}

/* ---------- Attendance & marks helpers ---------- */
.counts{display:flex;gap:10px;flex-wrap:wrap}
.count{padding:8px 12px;border-radius:10px;background:var(--line-soft);font-size:12px;color:var(--muted);min-width:96px}
.count strong{display:block;font-size:18px;color:var(--navy-deep);font-variant-numeric:tabular-nums}
.rate-cell{font-weight:650;font-variant-numeric:tabular-nums}
.inp-mark{width:92px;text-align:right}
.reason-in{min-width:180px}

/* ---------- Report card (A4) ---------- */
.print-root{display:flex;flex-direction:column;gap:24px;align-items:center}
.report-sheet{background:#fff;width:210mm;max-width:100%;min-height:297mm;padding:14mm 15mm;border:1px solid var(--line);box-shadow:var(--shadow);color:#111;font-size:12.5px;line-height:1.4;position:relative}
.report-sheet .rs-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--navy);padding-bottom:10px}
.report-sheet .rs-head .logo{width:70px;height:70px;border-radius:12px}
.report-sheet .rs-head h1{font-size:18px;color:var(--navy-deep)}
.report-sheet .rs-head p{font-size:11.5px;color:#444}
.report-sheet .rs-title{text-align:center;margin:12px 0 10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy-deep);font-size:13px}
.report-sheet .rs-info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 12px;border:1px solid #d6dde8;border-radius:8px;padding:10px;margin-bottom:12px}
.report-sheet .rs-info div span{display:block;font-size:10.5px;color:#5d6b7f;text-transform:uppercase;letter-spacing:.05em}
.report-sheet .rs-info div strong{font-size:12.5px}
.report-sheet table.rs-tbl{width:100%;border-collapse:collapse;margin-bottom:12px}
.report-sheet table.rs-tbl th,.report-sheet table.rs-tbl td{border:1px solid #d6dde8;padding:6px 8px;text-align:left;vertical-align:top}
.report-sheet table.rs-tbl th{background:#eef3fa;color:var(--navy-deep);font-size:11.5px}
.report-sheet table.rs-tbl td.c,.report-sheet table.rs-tbl th.c{text-align:center}
.report-sheet .rs-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.report-sheet .rs-box{border:1px solid #d6dde8;border-radius:8px;padding:9px 11px}
.report-sheet .rs-box h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--navy-deep);margin-bottom:6px}
.report-sheet .rs-comment{min-height:46px;white-space:pre-wrap}
.report-sheet .rs-sign{display:grid;grid-template-columns:1fr 1fr 1fr 150px;gap:14px;margin-top:26px;align-items:end}
.report-sheet .rs-sign div{border-top:1px solid #333;padding-top:4px;font-size:11px;color:#333}
.report-sheet .rs-stamp{border:1.5px dashed #8a96a8;height:76px;display:grid;place-items:center;color:#8a96a8;font-size:11px;border-radius:8px}
.report-sheet .rs-foot{margin-top:18px;font-size:10.5px;color:#555;border-top:1px solid #d6dde8;padding-top:6px}
.report-sheet .rs-promo{font-weight:700;color:var(--navy-deep)}
.report-sheet .screen-only{display:block}
.print-only{display:none}
.report-sheet textarea.input{font-size:12px;min-height:58px}

/* ---------- Support, permissions, chooser ---------- */
.support-card{margin:12px 12px 0;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#eaf3fc,#f4f9ff);border:1px solid var(--blue-line);font-size:12px;color:var(--muted)}
.support-card>a{display:block;color:var(--navy);font-size:15px;margin:2px 0 6px;text-decoration:none}
.support-card div{display:flex;gap:10px}
.support-card div a{font-weight:650;color:var(--navy)}
.feat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.feat{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff}
.feat:has(input:checked){border-color:var(--navy);background:var(--blue-soft)}
.feat input{margin-top:2px;accent-color:var(--navy);width:16px;height:16px}
.feat strong{display:block;font-size:13px;color:var(--navy-deep)}
.feat small{color:var(--muted);font-size:11.5px}
.cat-row td{background:#f3f7fc;font-weight:700;color:var(--navy-deep);font-size:12.5px;letter-spacing:.02em}
.auth-forgot{text-align:right;margin:-8px 0 14px;font-size:12.5px}
.auth-forgot .link{text-decoration:none}
.forgot-box{margin-top:16px;padding:14px;border-radius:12px;background:#fff8e6;border:1px solid #f2d9a8}
.forgot-box p{margin:4px 0 10px;color:var(--muted);font-size:13px}
.auth-foot a{color:var(--navy)}
.auth-side .auth-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.auth-side .auth-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,40,72,0) 40%,rgba(7,40,72,.82))}
.ch-list{display:flex;flex-direction:column;gap:10px}
.ch-scroll{max-height:46vh;overflow-y:auto;padding:2px}
.ch-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
.ch-card svg{width:46px;height:46px;flex:none}
.ch-card .ch-ico{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;background:var(--blue-soft)}
.ch-card .ch-ico svg{width:24px;height:24px}
.ch-card span:not(.ch-tick):not(.ch-ico){flex:1;min-width:0}
.ch-card strong{display:block;font-size:15px;color:var(--navy-deep)}
.ch-card small{color:var(--muted)}
.ch-tick{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;background:transparent;border:1.5px solid var(--line);flex:none;font-size:13px}
.ch-card.on{border-color:var(--navy);background:var(--blue-soft)}
.ch-card.on .ch-tick{background:var(--navy);border-color:var(--navy)}
.ch-help{text-align:right;margin:8px 0 18px;color:var(--muted)}
.ch-help a{color:var(--navy);font-weight:650}
.ch-count{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;vertical-align:middle;margin-left:6px}
/* ---------- Dashboard (reference layout) ---------- */
.welcome-card{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 22px;border-radius:var(--radius);background:linear-gradient(120deg,#0b6cb5,#1588d6);color:#dbeafa}
.welcome-card h2{color:#fff;font-size:22px}
.welcome-card p{margin-top:4px;font-size:13.5px}
.welcome-card p strong{color:#fff}
.welcome-support{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:10px 14px;font-size:12px}
.welcome-support strong{display:block;color:#fff;font-size:16px;margin:2px 0 6px}
.welcome-support .btn{background:#fff;border-color:#fff}
.ref-row{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:16px;align-items:stretch}
.ref-card{padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.ref-h{font-size:12.5px;font-weight:700;color:var(--muted);align-self:center}
.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--a) calc(var(--p) * 1%),var(--b) 0);display:grid;place-items:center}
.donut>div{width:104px;height:104px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut strong{color:var(--navy-deep);font-size:15px}
.donut span{font-size:13px;color:var(--muted)}
.ref-legend{display:flex;gap:18px;font-size:12.5px;color:var(--muted)}
.ref-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.ref-legend strong{color:var(--navy-deep);font-size:16px;margin-right:3px}
.ref-mid{display:flex;flex-direction:column;gap:14px}
.ref-enrol{background:#2f8ac4;color:#fff;border-radius:var(--radius);padding:18px;text-align:center;display:flex;flex-direction:column;gap:2px}
.ref-enrol span{font-size:17px;font-weight:700}
.ref-enrol strong{font-size:46px;font-weight:600;line-height:1.1}
.ref-enrol small{opacity:.85}
.ref-logo{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.ref-logo strong{display:block;color:var(--navy-deep)}
.ref-logo span{font-size:12px;color:var(--muted)}
.ref-tbl td.cf{background:#fbe9f2}
.ref-tbl td.cm{background:#e6f2fb}
.ref-tbl td.ct{background:#e4f4eb}
.inc-list{list-style:none;margin:0;padding:0}
.inc-list li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.inc-list li:last-child{border-bottom:0}
.inc-list a{color:var(--ink)}
.sec-title{margin:26px 0 12px;font-size:16px}
/* ---------- Homepage ---------- */
.home-root{background:#fff;min-height:var(--vh100)}
.hp-nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:14px max(16px,calc((100% - 1180px)/2));background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hp-brand{display:flex;align-items:center;gap:10px;color:var(--navy);text-decoration:none}
.hp-brand strong{font-weight:800;letter-spacing:.06em;font-size:17px}
.hp-nav nav{display:flex;gap:22px;margin-left:auto}
.hp-nav nav a{color:var(--ink);font-weight:500;font-size:14px}
.btn.lg{padding:13px 22px;font-size:15px;border-radius:12px}
.hp-hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding:56px max(16px,calc((100% - 1180px)/2)) 64px}
.hp-eyebrow{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);background:var(--blue-soft);padding:6px 12px;border-radius:99px}
.hp-eyebrow.light{background:rgba(255,255,255,.15);color:#fff}
.hp-hero h1{font-size:clamp(34px,4.4vw,54px);line-height:1.08;margin:18px 0 16px;color:var(--navy-deep);letter-spacing:-.02em}
.hp-hero p{font-size:17px;color:var(--muted);max-width:540px}
.hp-cta{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 20px}
.hp-ticks{list-style:none;padding:0;margin:0;display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.hp-ticks li::before{content:"✓";color:#21a04a;font-weight:800;margin-right:6px}
.hp-visual{position:relative}
.hp-visual img{width:100%;aspect-ratio:4/3.2;object-fit:cover;border-radius:24px;box-shadow:0 30px 60px rgba(11,40,80,.18)}
.hp-float{position:absolute;background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 12px 30px rgba(11,40,80,.16);font-size:12px;color:var(--muted)}
.hp-float strong{display:block;color:var(--navy-deep);font-size:14px}
.hp-float.a{left:-18px;bottom:28px}
.hp-float.b{right:-14px;top:24px}
.hp-dots{display:flex;gap:5px;margin-top:5px}
.hp-dots i{width:18px;height:18px;border-radius:5px}
.hp-sec{padding:72px max(16px,calc((100% - 1180px)/2))}
.hp-alt{background:var(--bg)}
.hp-head{text-align:center;max-width:680px;margin:0 auto 36px}
.hp-head.left{text-align:left;margin:0}
.hp-head h2{font-size:clamp(26px,3vw,36px);margin:14px 0 10px;color:var(--navy-deep)}
.hp-head p{color:var(--muted);font-size:15.5px}
.hp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.hp-feat{border:1px solid var(--line);border-radius:18px;padding:22px;background:#fff}
.hp-ico{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--blue-soft);color:var(--navy);margin-bottom:14px}
.hp-ico svg{width:22px;height:22px}
.hp-feat h3{font-size:16px;margin-bottom:6px}
.hp-feat p{color:var(--muted);font-size:14px}
.hp-two{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:center}
.hp-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.hp-steps li{display:flex;gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.hp-steps li>span{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.hp-steps h3{font-size:15.5px;margin-bottom:3px}
.hp-steps p{color:var(--muted);font-size:14px}
.hp-key{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px;font-size:13.5px;font-weight:600}
.hp-key i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.hp-card{border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(11,40,80,.10);background:#fff}
.hp-card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;color:var(--navy-deep)}
.hp-card-h span{font-size:12px;color:var(--muted)}
.hp-grid-tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.hp-grid-tbl td{border:1px solid #c9d2de;height:28px;font-size:12.5px}
.hp-grid-tbl td:first-child{width:34%;padding:0 8px}
.hp-c{background:color-mix(in srgb,var(--c) 22%,#fff)}
.hp-c.on{background:var(--c);box-shadow:inset 0 0 0 1.5px #111}
.hp-support{display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap;margin:0 max(16px,calc((100% - 1180px)/2)) 56px;padding:36px;border-radius:24px;background:linear-gradient(120deg,#0b6cb5,#073f6d);color:#dbeafa}
.hp-support h2{color:#fff;font-size:clamp(24px,2.6vw,32px);margin:12px 0 8px}
.hp-support-box{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:20px}
.hp-support-box strong{display:block;color:#fff;font-size:26px;margin-bottom:12px}
.hp-support-box .btn{background:#fff;color:var(--navy);border-color:#fff}
.hp-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px max(16px,calc((100% - 1180px)/2));border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media (max-width:960px){
  .hp-nav nav{display:none}
  .hp-nav .btn{margin-left:auto}
  .hp-hero,.hp-two{grid-template-columns:minmax(0,1fr);gap:32px}
  .hp-grid{grid-template-columns:minmax(0,1fr)}
  .hp-float.a{left:10px}
  .hp-float.b{right:10px}
  .ref-row{grid-template-columns:minmax(0,1fr)}
  .feat-grid{grid-template-columns:minmax(0,1fr)}
  .hp-sec{padding-top:52px;padding-bottom:52px}
}
@media (min-width:961px) and (max-width:1180px){.hp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- Class colours ---------- */
.cls-chip,.t-asm .cls-chip,.t-asm-head .cls-chip,.disc-h .cls-chip{color:#fff!important}
.lv-spread{display:inline-flex;gap:3px}
.lv-spread span{min-width:24px;height:22px;padding:0 6px;border-radius:6px;background:var(--c);color:#fff;font-weight:800;font-size:12px;display:inline-grid;place-items:center}
.cls-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;color:#fff;background:var(--c);white-space:nowrap}
.cls-chips{display:flex;flex-wrap:wrap;gap:4px}
.cls-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.cls-pick{display:flex;flex-wrap:wrap;gap:8px}
.cls-opt{cursor:pointer}
.cls-opt input{position:absolute;opacity:0;pointer-events:none}
.cls-opt span{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:2px solid var(--c);color:var(--c);font-weight:700;font-size:13px;background:#fff}
.cls-opt span::before{content:"";width:14px;height:14px;border-radius:4px;border:2px solid var(--c)}
.cls-opt input:checked+span{background:var(--c);color:#fff}
.cls-opt input:checked+span::before{background:#fff;box-shadow:inset 0 0 0 3px var(--c)}
.cls-opt input:focus-visible+span{outline:2px solid var(--navy);outline-offset:2px}
.cls-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cls-tile{border-radius:16px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 30%,#fff);background:color-mix(in srgb,var(--c) 7%,#fff)}
.cls-tile-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 72%,#000))}
.cls-tile-h span{font-size:12px;opacity:.9}
.cls-tile-b{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.t-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600}
.t-pill .avatar{width:24px;height:24px;font-size:10px}
.t-pill.lead{border-color:var(--c);color:color-mix(in srgb,var(--c) 75%,#000)}
.cls-none{font-size:12.5px;color:var(--muted)}
/* ---------- Teacher mode (mobile first) ---------- */
.tabbar{display:none}
.teacher-mode .toasts{bottom:calc(84px + env(safe-area-inset-bottom));right:16px;left:16px;max-width:none;align-items:center}
.teacher-mode .app{grid-template-columns:minmax(0,1fr)}
.teacher-mode .sidebar,.teacher-mode .scrim,.teacher-mode .menu-btn{display:none!important}
.teacher-mode .topbar{padding:10px 16px;min-height:0}
.teacher-mode .banners{max-width:820px;margin:0 auto;width:100%;padding:0 16px}
.teacher-mode .view{max-width:820px;margin:0 auto;width:100%;padding:14px 16px 120px}
.teacher-mode .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);justify-content:center;gap:4px;padding:6px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(11,40,80,.06)}
.tabbar a{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:14px;color:var(--muted);font-size:12px;font-weight:650;text-decoration:none}
.tabbar a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--navy);background:var(--blue-soft)}
.t-top{display:flex;align-items:center;gap:10px;width:100%;max-width:820px;margin:0 auto}
.t-top .kn-mark{width:34px;height:34px}
.t-top-txt{min-width:0;flex:1}
.t-top-txt strong{display:block;font-size:14.5px;color:var(--navy-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-top-txt span{font-size:12px;color:var(--muted)}
.t-out{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px 3px 3px;font-size:12.5px;font-weight:600}
.t-out .avatar{width:30px;height:30px;font-size:11px;background:var(--navy);color:#fff;border:0}
.t-hello{border-radius:22px;padding:22px;color:#fff;background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.25),transparent 40%),linear-gradient(135deg,#7c4dff,#2f80ed 55%,#12a5a5)}
.t-hello span{font-size:12.5px;opacity:.9}
.t-hello h2{color:#fff;font-size:24px;margin:4px 0}
.t-hello p{font-size:13.5px;opacity:.95}
.t-sec{margin:22px 2px 10px;font-size:16px}
.t-classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.t-class{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 68%,#000));box-shadow:0 10px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.t-class-h{display:flex;justify-content:space-between;align-items:flex-start}
.t-class-h h3{color:#fff;font-size:19px}
.t-class-h span{font-size:12.5px;opacity:.92}
.t-class-badge{background:rgba(255,255,255,.22);border-radius:10px;padding:4px 8px;font-weight:800;font-size:12px;letter-spacing:.06em}
.t-class-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0;background:rgba(255,255,255,.14);border-radius:14px;padding:10px}
.t-class-stats strong{display:block;font-size:15px}
.t-class-stats span{font-size:11px;opacity:.9}
.t-class-a{display:flex;gap:8px}
.t-class-a .btn{flex:1;background:#fff;border-color:#fff;color:color-mix(in srgb,var(--c) 75%,#000);padding:11px 10px;font-size:14px}
.t-class-a .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.t-help{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.t-help strong{display:block}
.t-help span{font-size:12.5px;color:var(--muted)}
.t-empty{text-align:center;padding:30px 18px;background:#fff;border:1px dashed var(--line);border-radius:18px}
.t-empty p{color:var(--muted);margin:6px 0 14px}
.t-head h2{font-size:22px}
.t-head p{color:var(--muted);font-size:13.5px;margin:2px 0 12px}
.t-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.t-chip{flex:none;padding:10px 16px;border-radius:999px;border:2px solid var(--c);color:color-mix(in srgb,var(--c) 80%,#000);background:#fff;font-weight:750;font-size:14px}
.t-chip small{opacity:.75;margin-left:4px;font-weight:600}
.t-chip.on{background:var(--c);color:#fff}
.t-bar{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.t-date{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 10px;height:44px;flex:1;min-width:180px}
.t-date svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:1.8}
.t-date input{border:0;font-size:15px;flex:1;background:transparent;outline:none}
.t-counts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.t-count{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px}
.t-count i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.t-list{display:flex;flex-direction:column;gap:10px}
.disc-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.disc-item{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;background:#fff;padding:12px 14px}
.disc-h{display:flex;align-items:center;gap:10px}
.disc-h>div{flex:1;min-width:0}
.disc-h strong{display:block;color:var(--navy-deep)}
.disc-h span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.disc-ico{font-size:22px}
.disc-b{margin-top:8px;font-size:13.5px}
.disc-act{display:block;margin-top:4px;color:var(--ink)}
.disc-meta{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.disc-meta b{color:var(--bad)}
.disc-types{display:flex;gap:8px;flex-wrap:wrap}
.disc-type input{position:absolute;opacity:0;pointer-events:none}
.disc-type span{display:inline-flex;padding:10px 14px;border-radius:12px;border:2px solid color-mix(in srgb,var(--c) 45%,#fff);background:#fff;font-weight:700;font-size:13.5px;cursor:pointer}
.disc-type input:checked+span{background:var(--c);border-color:var(--c);color:#fff}
.disc-type input:focus-visible+span{outline:2px solid var(--navy);outline-offset:2px}
.t-pick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;padding:14px;border-radius:18px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--c)}
.t-field>span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.t-cls-sel{height:48px;font-size:15.5px;font-weight:650}
.t-datebar{display:flex;gap:6px}
.t-datebar .input{height:48px;font-size:15.5px;flex:1;min-width:0}
.t-nav{width:48px;height:48px;flex:none;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:22px;color:var(--navy)}
.t-nav:disabled{opacity:.35}
.t-quick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.t-quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:650;font-size:13px}
.t-quick button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.t-quick span{font-size:12.5px;color:var(--muted);margin-left:4px}
.t-follow{flex-basis:100%;margin-top:4px;padding:12px;border-radius:14px;background:#fff4f2;border:1px solid #f5c2b8}
.t-parent{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.t-parent span{display:block;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.t-parent strong{display:block;color:var(--navy-deep)}
.t-parent a{font-weight:700;color:var(--bad);font-size:15px}
.t-parent-a{display:flex;gap:6px}
.t-parent-a a{color:var(--navy-deep);font-size:13px}
.t-parent-a a.primary{color:#fff}
.t-reason{height:44px}
.t-reason.need{border-color:var(--bad);outline:2px solid #f5c2b8}
.t-remind{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#fff3dc,#ffe7c2);border:1px solid #f2c46b}
.t-remind strong{display:block;color:#8f5606;margin-bottom:6px}
.t-remind span{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.t-remind small{color:var(--muted);margin-right:6px}
.t-remind .btn{background:#8f5606;border-color:#8f5606;color:#fff}
.t-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:6px 0 14px}
.t-stats .stat{padding:14px}
.t-stats .stat::before{width:32px;height:32px;margin-bottom:6px;background-size:17px}
.t-stats .val{font-size:24px}
.t-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.t-tools h3{font-size:16px}
.t-badge{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 7px;border-radius:999px;background:var(--line-soft);font-size:12px;margin-left:4px}
.t-filter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px;margin-bottom:10px}
.t-filter .input{height:44px}
.t-asm-main{min-width:0}
.t-reg-cls{display:flex!important;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.t-reg-cls small{color:var(--muted);font-size:12px}
.t-reg-counts{display:flex!important;flex-wrap:wrap;gap:6px}
.t-reg-counts .t-count{padding:3px 9px;font-size:12px}
.t-reg-abs{display:block;margin-top:6px;font-size:12.5px!important;color:#9a3412!important;background:#fff4f2;border-radius:8px;padding:5px 8px}
.t-reg-abs em{font-style:normal;color:var(--ink)}
.t-filter.one{grid-template-columns:minmax(0,1fr)}
.t-asm-main strong{font-size:15px}
.t-asm-date{font-size:12px!important;font-weight:700;color:var(--navy)!important}
.t-asm-main>span:last-child{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.t-asm-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.t-asm-max{font-size:12px!important}
.t-asm-go{font-weight:700;color:var(--navy)!important;font-size:13px!important}
@media (max-width:640px){
  .t-pick,.t-filter{grid-template-columns:minmax(0,1fr)}
  .t-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.t-learner.todo{border-color:#f2c46b;background:#fffaf0}
.t-count.todo i{background:#f2c46b}
.t-ok{margin:12px 0;padding:14px 16px;border-radius:16px;background:#e4f4eb;border:1px solid #9fd3b6;color:#145c3a}
.t-ok strong{display:block;font-size:15px}
.t-ok span{font-size:13px}
.t-save .btn:disabled{opacity:1;background:#9db6cf;border-color:#9db6cf;box-shadow:none}
.t-learner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:#fff}
.t-learner>.who{flex:1;min-width:150px}
.t-status{display:flex;gap:6px}
.t-status button{width:50px;height:50px;border-radius:14px;border:2px solid color-mix(in srgb,var(--c) 40%,#fff);background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.t-status button b{font-size:17px}
.t-status button small{font-size:8.5px;font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.02em}
.t-status button.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 35%,transparent)}
.t-save{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));margin-top:14px;z-index:5}
.t-save .btn{width:100%;padding:15px;font-size:16px;border-radius:16px;box-shadow:0 10px 24px rgba(11,108,181,.3)}
.t-terms{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
.t-terms button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.t-terms button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.t-subj{display:block;margin:8px 0 12px}
.t-subj span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.t-subj select{height:48px;font-size:15px}
.t-asms{display:flex;flex-direction:column;gap:8px}
.t-asm{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff}
.t-asm strong{display:block;font-size:15px;color:var(--navy-deep)}
.t-asm span{font-size:12.5px;color:var(--muted)}
.t-new{margin-top:16px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#eef6ff,#f7f3ff);border:1px solid var(--blue-line)}
.t-new h4{margin-bottom:10px}
.t-new-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.t-new-g span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.t-new .btn{width:100%;padding:13px}
.t-asm-head{display:flex;align-items:center;gap:12px;margin:12px 0}
.t-asm-head strong{display:block;color:var(--navy-deep)}
.t-asm-head span{font-size:12.5px;color:var(--muted)}
.t-key{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;font-weight:600;margin-bottom:10px}
.t-key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.t-lv .lv span{width:52px;height:50px;border-radius:14px;flex-direction:column;font-size:16px;line-height:1}
.t-lv .lv span small{font-size:8.5px;font-weight:700;margin-top:3px}
.t-lv .lv.none span{width:40px}
.t-mark{display:flex;align-items:center;gap:8px}
.t-mark .input{width:86px;height:48px;font-size:18px;text-align:center}
.t-comment{flex-basis:100%;height:38px;font-size:13px}
@media (max-width:520px){
  .t-status,.t-lv{width:100%}
  .t-status button,.t-lv .lv{flex:1}
  .t-lv .lv span,.t-status button{width:100%}
  .t-out-l{display:none}
  .t-out{padding:3px}
}
tr.is-suspended td{opacity:.6}
/* ---------- Approval & setup wizard ---------- */
.nav-badge{margin-left:auto;font-style:normal;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:#e2472f;color:#fff;font-size:11.5px;font-weight:800;display:inline-grid;place-items:center}
.del-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.del-grid div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff}
.del-grid b{display:block;font-size:20px;color:var(--bad)}

.gen-card{border-color:var(--blue-line);background:linear-gradient(135deg,#f3f9ff,#fff)}

.banner.ok{background:#e4f4eb;color:#145c3a;border:1px solid #9fd3b6}
.rev-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin-bottom:12px}
.rev-f span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}

.sugg-tbl th,.sugg-tbl td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:left}
.sugg-tbl th{background:#fdf3d7;font-size:12px;color:var(--muted)}

.input.sugg{border-color:#f3a712;background:#fffaf0}

@media (max-width:640px){.rev-grid{grid-template-columns:minmax(0,1fr)}}
.rev-wrap{border-color:#f2c46b;background:linear-gradient(135deg,#fffaf0,#fff)}
.rev-list{display:grid;gap:10px}
.rev-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.rev-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rev-h strong{display:block;font-size:15.5px;color:var(--navy-deep)}
.rev-h span{font-size:12.5px;color:var(--muted)}
.rev-dir{font-size:13px;color:var(--muted);margin:6px 0 10px}
.rev-dir strong{color:var(--ink)}
.rev-a{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.rev-detail img{width:110px;height:110px;object-fit:contain;border:1px solid var(--line);border-radius:14px}
.pend-steps{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:10px}
.pend-steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.pend-steps b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line-soft);color:var(--muted)}

.pend-steps span{font-size:13px;color:var(--muted)}
.pend-steps li.done b{background:#21a04a;color:#fff}
.pend-steps li.now{border-color:#f2c46b;background:#fffaf0}
.pend-steps li.now b{background:#f3a712;color:#fff}
.pend-steps li.bad{border-color:#f0c4c4;background:#fff4f4}
.pend-steps li.bad b{background:var(--bad);color:#fff}

.pend-kv div{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.pend-kv span{display:block;font-size:11.5px;color:var(--muted);font-weight:700}

.wz-a{display:flex;gap:8px;flex-wrap:wrap}

tr.is-suspended td:last-child{opacity:1}
/* ---------- Colour levels ---------- */
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--ink);white-space:nowrap}
.lvl i{width:14px;height:14px;border-radius:4px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.lv-pick{display:inline-flex;gap:4px;justify-content:flex-end}

.lv span{display:grid;place-items:center;width:34px;height:30px;border-radius:8px;background:color-mix(in srgb,var(--c) 22%,#fff);color:#333;font-weight:700;font-size:12px;border:2px solid transparent}
.lv input:checked+span{background:var(--c);color:#fff;border-color:rgba(0,0,0,.25);box-shadow:0 0 0 2px #fff inset}

/* ---------- 1. Helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => isoOf(new Date());
const nowISO = () => new Date().toISOString();
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return isoOf(d); };
const dayDiff = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const isWeekday = s => { const w = parseISO(s).getDay(); return w > 0 && w < 6; };
const fmtDate = s => (s ? parseISO(s).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—');
const fmtStamp = s => (s ? new Date(s).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—');

  const a = parseISO(dob), b = parseISO(on);
  let y = b.getFullYear() - a.getFullYear(), m = b.getMonth() - a.getMonth();
  if (b.getDate() < a.getDate()) m--;
  if (m < 0) { y--; m += 12; }
  return y > 0 ? `${y} yr ${m} mo` : `${m} mo`;
};
const ratio = (part, whole) => (whole ? Math.round((part / whole) * 1000) / 10 : null);
const fmtPct = v => (v === null || v === undefined || Number.isNaN(v) ? '—' : `${(Math.round(v * 10) / 10).toFixed(1)}%`);
const byName = (a, b) => String(a).localeCompare(String(b), 'en', { sensitivity: 'base' });
const avg = arr => (arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null);
const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);

const initials = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
class AppError extends Error {}

function readImageFile(file, maxSide, mime) {
  return new Promise((resolve, reject) => {
    if (!file || !file.size) return resolve(null);
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return reject(new AppError('Please choose a PNG, JPG or WebP image.'));
    if (file.size > 6 * 1024 * 1024) return reject(new AppError('Image must be smaller than 6 MB.'));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * s));
      c.height = Math.max(1, Math.round(img.height * s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL(mime || 'image/png', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new AppError('That image could not be read.')); };
    img.src = url;
  });

};

/* Current working context: the viewed year and term (defaults to the active ones). */
function ctx() {
  const ay = activeYear();
  let year = ui.viewYearId ? byId('academicYears', ui.viewYearId) : null;
  if (!year || year.schoolId !== sid()) year = ay || yearsSorted()[0] || null;
  /* School users work in the current term and may go back to earlier terms; future terms are hidden. */
  const terms = year ? termsOf(year.id).filter(t => isSuper() || t.status !== 'Upcoming') : [];
  let term = ui.viewTermId ? terms.find(t => t.id === ui.viewTermId) || null : null;
  if (!term && year) term = terms.find(t => t.status === 'Active') || terms.find(t => t.status === 'Upcoming') || terms[terms.length - 1] || null;
  const readOnly = !year || !term || term.status === 'Completed' || year.status === 'Closed';
  /* Marks of a completed term can still be corrected while its year is open. */
  const canCorrect = !!(year && term && year.status !== 'Closed' && (term.status === 'Completed' || term.status === 'Active' || isSuper()));
  return { year, terms, term, readOnly, canCorrect, isCurrentYear: !!(year && ay && year.id === ay.id), isCurrentTerm: !!(term && ay && year.id === ay.id && term.status === 'Active') };
}

function makeClasses(schoolId) {
  const classes = DEFAULT_CLASSES.map((c, i) => ({ id: uid('cls'), schoolId, name: c.name, code: c.code, capacity: c.capacity, order: i + 1, nextClassId: null }));
  classes.forEach((c, i) => { c.nextClassId = classes[i + 1] ? classes[i + 1].id : null; });
  const areas = [];
  DEFAULT_CLASSES.forEach((c, i) => c.areas.forEach(([name, kind, max, group], j) => {
    areas.push({ id: uid('la'), schoolId, classId: classes[i].id, name, kind, maxMarks: kind === 'numerical' ? max : 0, group: group || '', order: j + 1 });
  }));
  return { classes, areas };
}
function splitTerms(open, close, names) {
  const total = dayDiff(open, close) + 1;
  const size = Math.floor(total / names.length);
  return names.map((name, i) => ({
    name, order: i + 1,
    openDate: addDays(open, i * size),
    closeDate: i === names.length - 1 ? close : addDays(open, (i + 1) * size - 1),
  }));
}
function makeYear(schoolId, name, openDate, closeDate, status, termNames) {
  const year = { id: uid('yr'), schoolId, name, openDate, closeDate, status };
  const terms = splitTerms(openDate, closeDate, termNames).map((t, i) => ({
    id: uid('tm'), schoolId, yearId: year.id, name: t.name, order: t.order, openDate: t.openDate, closeDate: t.closeDate,
    status: i === 0 && status === 'Active' ? 'Active' : 'Upcoming',
  }));
  return { year, terms };
}
function attendanceSummary(studentId, termId) {
  const set = settingsOf();
  const recs = db.attendance.filter(a => a.studentId === studentId && a.termId === termId);
  const counts = {};
  set.attendanceCategories.forEach(c => { counts[c.key] = 0; });
  let attended = 0, absent = 0, excused = 0;
  recs.forEach(r => {
    counts[r.status] = (counts[r.status] || 0) + 1;
    const cat = set.attendanceCategories.find(c => c.key === r.status);
    if (cat && cat.attended === true) attended++;
    else if (cat && cat.attended === false) absent++;
    else excused++;
  });
  return { totalDays: recs.length, counts, attended, absent, excused, rate: ratio(attended, attended + absent) };
}

/* ---------- 11. School information ---------- */
function readSchoolFields(fd) {
  const get = k => String(fd.get(k) || '').trim();
  const data = {
    name: get('name'), regNumber: get('regNumber'), motto: get('motto'), district: get('district'), sector: get('sector'),
    cell: get('cell'), village: get('village'), address: get('address'), email: get('email'), phone: get('phone'),
    director: get('director'), headteacher: get('headteacher'),
  };
  const required = { 'school name': data.name, 'registration number': data.regNumber, district: data.district, sector: data.sector, cell: data.cell, village: data.village, address: data.address, email: data.email, phone: data.phone, director: data.director, headteacher: data.headteacher };
  const missing = Object.keys(required).filter(k => !required[k]);
  if (missing.length) throw new AppError(`Please complete: ${missing.join(', ')}.`);
  if (!isEmail(data.email)) throw new AppError('Enter a valid official email address.');
  if (!isPhone(data.phone)) throw new AppError('Enter a valid phone number, for example +250 788 123 456.');
  return data;
}

function buildSchool(data, yearIn, logo) {
  validateYearDates([], yearIn.name, yearIn.openDate, yearIn.closeDate, '');
  const id = uid('sch');
  db.schools.push({ id, ...data, logo: logo || '', status: 'Active', createdAt: nowISO(), setup: { profile: false, classes: false, done: false } });
  db.settings[id] = defaultSettings();
  const { classes, areas } = makeClasses(id);
  db.classes.push(...classes);
  db.learningAreas.push(...areas);
  const y = makeYear(id, yearIn.name, yearIn.openDate, yearIn.closeDate, 'Active', db.settings[id].termNames);
  db.academicYears.push(y.year);
  db.terms.push(...y.terms);
  db.activeSchoolId = id;
  return id;
}
function createSchool(data, yearIn, logo) {
  if (db.schools.some(s => s.regNumber.toLowerCase() === data.regNumber.toLowerCase())) throw new AppError('A school with this registration number already exists.');
  validateYearDates([], yearIn.name, yearIn.openDate, yearIn.closeDate, '');
  const id = uid('sch');
  db.schools.push({ id, ...data, logo: logo || '', status: 'Active', createdAt: nowISO() });
  db.settings[id] = defaultSettings();
  const { classes, areas } = makeClasses(id);
  db.classes.push(...classes);
  db.learningAreas.push(...areas);
  const y = makeYear(id, yearIn.name, yearIn.openDate, yearIn.closeDate, 'Active', db.settings[id].termNames);
  db.academicYears.push(y.year);
  db.terms.push(...y.terms);
  db.activeSchoolId = id;
  resetContext();
  commit('School created', data.name);
}
function updateSchool(id, data, logo, removeLogo) {
  requireWritable();

  if (db.schools.some(s => s.id !== id && s.regNumber.toLowerCase() === data.regNumber.toLowerCase())) throw new AppError('Another school already uses this registration number.');

function termFormHtml(t, y) {

function openTermForm(termId, yearId) {
  requireWritable();
  const t = termId ? byId('terms', termId) : null;
  const y = byId('academicYears', t ? t.yearId : yearId);
  if (!y) throw new AppError('Select an academic year first.');
  if (y.status === 'Closed') throw new AppError(`${y.name} is closed, so its terms cannot be changed.`);
  if (t && t.status === 'Completed') throw new AppError(`${t.name} is completed. Make it current first if a correction is needed.`);
  openForm({ title: t ? `Edit ${t.name}` : `Add a term to ${y.name}`, form: 'term', arg: t ? t.id : `new:${y.id}`, submit: t ? 'Save term' : 'Add term', html: termFormHtml(t, y) });
}
FORMS.term = (fd, arg) => {
  requireWritable();
  const name = String(fd.get('name') || '').trim();
  const openDate = fd.get('openDate'), closeDate = fd.get('closeDate');
  const creating = arg.startsWith('new:');
  const t = creating ? null : byId('terms', arg);
  const y = byId('academicYears', creating ? arg.slice(4) : t.yearId);
  if (y.status === 'Closed') throw new AppError(`${y.name} is closed; its terms cannot be changed.`);
  if (!name) throw new AppError('Enter a term name.');
  if (!openDate || !closeDate || closeDate <= openDate) throw new AppError('The closing date must be after the opening date.');
  if (openDate < y.openDate || closeDate > y.closeDate) throw new AppError(`Term dates must fall within ${y.name}.`);
  const others = termsOf(y.id).filter(x => !t || x.id !== t.id);
  if (others.some(x => x.name.toLowerCase() === name.toLowerCase())) throw new AppError(`${name} already exists in ${y.name}.`);
  if (others.some(x => openDate <= x.closeDate && closeDate >= x.openDate)) throw new AppError('These dates overlap another term in this year.');
  if (t) {
    if (t.status === 'Completed') throw new AppError(`${t.name} is completed and cannot be edited.`);
    Object.assign(t, { name, openDate, closeDate });
    commit('Term updated', `${name} · ${y.name}`);
  } else {
    db.terms.push({ id: uid('tm'), schoolId: sid(), yearId: y.id, name, order: others.length + 1, openDate, closeDate, status: 'Upcoming' });
    commit('Term added', `${name} · ${y.name}`);
  }
  return true;
};
function setActiveTerm(t, completePrevious) {
  const y = byId('academicYears', t.yearId);
  if (!y || y.status !== 'Active') throw new AppError(`Set ${y ? y.name : 'the academic year'} as the current year before switching terms.`);
  if (t.status === 'Active') return;
  const prev = termsOf(y.id).find(x => x.status === 'Active' && x.id !== t.id);
  if (prev) prev.status = completePrevious ? 'Completed' : 'Upcoming';
  t.status = 'Active';
  resetContext();
  commit('Current term switched', `${t.name} · ${y.name}${prev ? ` (${prev.name} ${completePrevious ? 'completed' : 'set to upcoming'})` : ''}`);
}
function openSwitchTermModal(preselectId) {
  requireSchool();
  const ay = activeYear();
  if (!ay) throw new AppError('Set an academic year as current first.');
  const terms = termsOf(ay.id);
  if (!terms.length) throw new AppError('This year has no terms yet.');
  const current = terms.find(t => t.status === 'Active');
  const pre = preselectId || (terms.find(t => t.status === 'Upcoming') || current || terms[0]).id;
  openForm({
    title: 'Switch current term', form: 'switch-term', submit: 'Switch term',
    html: `<p class="muted mb">Choose the term in session for <strong>${esc(ay.name)}</strong>. Assessment, attendance and report pages will all follow the selected term. Previous results are never deleted.</p>
    <div class="checklist">${terms.map(t => `<label class="card" style="padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;box-shadow:none"><input type="radio" name="termId" value="${t.id}" ${t.id === pre ? 'checked' : ''}><div class="grow"><strong>${esc(t.name)}</strong><div class="small muted">${fmtDate(t.openDate)} – ${fmtDate(t.closeDate)}</div></div>${badge(t.status)}</label>`).join('')}</div>
    <label class="check mt"><input type="checkbox" name="completePrev" checked> Mark the previous active term as completed (recommended)</label>`,
  });
}

function termCardHtml(t, yr) {

}

FORMS.class = (fd, arg) => {
  requireWritable();
  const name = String(fd.get('name') || '').trim();
  const code = String(fd.get('code') || '').trim().toUpperCase();
  const capacity = Number(fd.get('capacity'));
  const nextClassId = fd.get('nextClassId') || null;
  if (!name || !code) throw new AppError('Class name and code are required.');
  if (!Number.isInteger(capacity) || capacity < 1 || capacity > 60) throw new AppError('Capacity must be a whole number between 1 and 60.');
  if (classList().some(c => c.id !== arg && (c.name.toLowerCase() === name.toLowerCase() || c.code === code))) throw new AppError('Another class already uses this name or code.');
  if (arg && nextClassId === arg) throw new AppError('A class cannot progress to itself.');
  if (arg && nextClassId) {
    let cur = nextClassId; const seen = new Set();
    while (cur && !seen.has(cur)) {
      if (cur === arg) throw new AppError('This progression would loop back to the same class.');
      seen.add(cur);
      const nx = byId('classes', cur);
      cur = nx ? nx.nextClassId : null;
    }
  }
  if (arg) {
    const c = byId('classes', arg);
    const enrolled = studentsIn(arg).length;
    if (capacity < enrolled) throw new AppError(`Capacity cannot be lower than the ${enrolled} learners currently enrolled.`);
    Object.assign(c, { name, code, capacity, nextClassId });
    commit('Class updated', name);
  } else {
    db.classes.push({ id: uid('cls'), schoolId: sid(), name, code, capacity, order: classList().length + 1, nextClassId });
    commit('Class added', name);
  }
  return true;
};

/* ---------- 15. Teachers and class-teacher assignments ---------- */
function assignmentPlan(teacherId, classId) {
  const t = byId('teachers', teacherId), c = byId('classes', classId);
  const curClass = teacherAssignment(teacherId);
  const curTeacher = classAssignment(classId);
  return {
    t, c,
    already: !!(curTeacher && curTeacher.teacherId === teacherId),
    releaseTeacher: curClass && curClass.classId !== classId ? curClass : null,
    releaseClassTeacher: curTeacher && curTeacher.teacherId !== teacherId ? curTeacher : null,
  };
}
function checkAssignable(plan) {
  if (!plan.t) throw new AppError('Choose a teacher.');
  if (!plan.c) throw new AppError('Choose a class.');
  if (plan.t.employmentStatus !== 'Active') throw new AppError(`${plan.t.fullName} is ${plan.t.employmentStatus.toLowerCase()}. Set the employment status to Active before assigning a class.`);
  if (plan.already) throw new AppError(`${plan.t.fullName} is already the class teacher for ${plan.c.name}.`);
}
function closeAssignment(a, endDate, releaseReason) { a.status = 'Released'; a.endDate = endDate; a.releaseReason = releaseReason; }
function assignTeacher(teacherId, classId, reason) {
  requireWritable();
  const plan = assignmentPlan(teacherId, classId);
  checkAssignable(plan);
  const today = todayISO();
  if (plan.releaseTeacher) closeAssignment(plan.releaseTeacher, today, `Reassigned to ${plan.c.name}`);
  if (plan.releaseClassTeacher) closeAssignment(plan.releaseClassTeacher, today, 'Replaced by another class teacher');
  db.assignments.push({ id: uid('asg'), schoolId: sid(), teacherId, classId, startDate: today, endDate: null, status: 'Active', reason: reason || 'Class teacher assignment', releaseReason: '' });
  return plan;
}
function assignPreviewLines(plan) {
  if (!plan.t || !plan.c) return { tone: 'info', lines: ['Select a teacher and a class to see the changes.'] };
  if (plan.already) return { tone: 'warn', lines: [`${esc(plan.t.fullName)} is already the class teacher for ${esc(plan.c.name)}. No change is needed.`] };
  const lines = [];
  if (plan.t.employmentStatus !== 'Active') lines.push(`${esc(plan.t.fullName)} is ${esc(plan.t.employmentStatus.toLowerCase())}. Activate the teacher before assigning.`);
  lines.push(`${esc(plan.t.fullName)} will become class teacher of ${esc(plan.c.name)}.`);
  if (plan.releaseTeacher) lines.push(`${esc(plan.t.fullName)} will be released from ${esc(classNameOf(plan.releaseTeacher.classId))}.`);
  if (plan.releaseClassTeacher) lines.push(`${esc(teacherNameOf(plan.releaseClassTeacher.teacherId))} will be released as class teacher of ${esc(plan.c.name)}.`);
  return { tone: plan.t.employmentStatus !== 'Active' ? 'warn' : 'info', lines };
}

FORMS.teacher = async (fd, arg) => {
  requireWritable();

    email: String(fd.get('email') || '').trim(), username: String(fd.get('username') || '').trim().toLowerCase(),

    classIds: fd.getAll('tclass').map(String).filter(id => byId('classes', id)),
  };
  if (!data.fullName) throw new AppError('Enter the teacher’s full name.');
  if (!isPhone(data.phone)) throw new AppError('Enter a valid phone number.');
  if (!isEmail(data.email)) throw new AppError('Enter a valid email address.');
  if (!/^[a-z0-9._-]{3,30}$/.test(data.username)) throw new AppError('Username must be 3–30 characters: lowercase letters, numbers, dots or dashes.');
  if (S('teachers').some(t => t.id !== arg && t.username === data.username)) throw new AppError('This username is already in use.');
  if (S('teachers').some(t => t.id !== arg && t.email.toLowerCase() === data.email.toLowerCase())) throw new AppError('This email address is already registered.');
  if (arg) {
    const t = byId('teachers', arg);
    const cur = teacherAssignment(t.id);
    if (data.employmentStatus !== 'Active' && cur) {
      // Non-active teachers cannot lead a class: release the current assignment (history is kept).
      closeAssignment(cur, todayISO(), `Released: teacher is ${data.employmentStatus.toLowerCase()}`);

    Object.assign(t, data);

    const tid = uid('tch');
    db.teachers.push({ id: tid, schoolId: sid(), ...data, createdAt: nowISO() });

/* Create or update the teacher's own login and feature permissions. */
async function saveTeacherLogin(t, fd) {
  const feats = fd.getAll('feat').map(String).filter(f => FEATURE_NAME[f]);
  const memberId = String(fd.get('memberId') || '');
  if (memberId) {
    const { error } = await sb.rpc('kn_set_features', { p_user: memberId, p_features: feats });
    if (error) throw new AppError('Teacher saved, but features could not be updated: ' + error.message);
    ui.members = null; render();
    return;
  }
  if (fd.get('createLogin') !== '1') return;
  const password = String(fd.get('loginPassword') || '');
  if (password.length < 6) throw new AppError('Teacher saved. To create the login, enter a temporary password of at least 6 characters (Edit the teacher).');
  const email = String(t.email || '').trim().toLowerCase();
  const tmp = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: false, autoRefreshToken: false, storageKey: 'kn-tmp-' + Date.now() } });
  const res = await tmp.auth.signUp({ email, password, options: { data: { full_name: t.fullName } } });
  if (res.error && !/already/i.test(res.error.message)) throw new AppError('Teacher saved, but the login could not be created: ' + res.error.message);
  const { error } = await sb.rpc('kn_add_member', { p_email: email, p_name: t.fullName, p_role: 'teacher', p_school: ws.schoolId, p_features: feats, p_teacher_id: t.id });
  if (error) throw new AppError('Teacher saved, but the login could not be linked: ' + error.message);
  toast(res.error ? `${email} already had an account; it can now log in as a teacher.` : `Login created. ${t.fullName} can log in with ${email}.`, 'ok', 6500);
  ui.members = null; render();
}

const monthsBetween = (a, b) => { const A = parseISO(a), B = parseISO(b); return (B.getFullYear() - A.getFullYear()) * 12 + (B.getMonth() - A.getMonth()) - (B.getDate() < A.getDate() ? 1 : 0); };
function nextRegNumber(admissionDate) {

  return `NS-${yr}-${String(max + 1).padStart(3, '0')}`;
}

      <fieldset class="fieldset span2"><legend>Parent / guardian</legend><div class="form-grid">
        ${field('Guardian name *', inp('guardianName', st ? st.guardianName : '', 'required'))}
        ${field('Guardian phone *', inp('guardianPhone', st ? st.guardianPhone : '', 'required'))}
        ${field('Guardian email', inp('guardianEmail', st ? st.guardianEmail : '', 'type="email"'), 'Optional')}

  });

FORMS.student = (fd, arg) => {
  requireWritable();
  requireFeature('students');
  const get = k => String(fd.get(k) || '').trim();
  const data = {
    regNumber: get('regNumber').toUpperCase(), fullName: get('fullName'), dob: get('dob'), gender: get('gender'),
    admissionDate: get('admissionDate'), classId: get('classId'), status: get('status') || 'Active',
    guardianName: get('guardianName'), guardianPhone: get('guardianPhone'), guardianEmail: get('guardianEmail'),
  };
  const photo = ui.pendingPhoto;
  ui.pendingPhoto = null;
  if (!data.regNumber || !data.fullName || !data.dob || !data.admissionDate || !data.classId || !data.guardianName || !data.guardianPhone) throw new AppError('Please complete all required fields.');
  if (!GENDERS.includes(data.gender)) throw new AppError('Choose a gender from the list.');
  if (!STUDENT_STATUSES.includes(data.status)) throw new AppError('Choose a valid learner status.');
  if (S('students').some(s => s.id !== arg && s.regNumber.toUpperCase() === data.regNumber)) throw new AppError(`Registration number ${data.regNumber} is already used by another learner.`);
  if (!isPhone(data.guardianPhone)) throw new AppError('Enter a valid guardian phone number.');
  if (data.guardianEmail && !isEmail(data.guardianEmail)) throw new AppError('Enter a valid guardian email address, or leave it blank.');
  if (data.dob >= data.admissionDate) throw new AppError('Date of birth must be before the admission date.');
  const months = monthsBetween(data.dob, data.admissionDate);
  if (months < 12 || months > 96) throw new AppError('Learners are usually between 1 and 8 years old at admission. Check the date of birth.');
  const target = byId('classes', data.classId);
  if (!target) throw new AppError('Choose a valid class.');
  const existing = arg ? byId('students', arg) : null;
  const becomesActive = data.status === 'Active' && (!existing || existing.status !== 'Active' || existing.classId !== data.classId);
  if (becomesActive) {
    const n = studentsIn(data.classId).filter(s => s.id !== arg).length;
    if (n >= target.capacity) throw new AppError(`${target.name} is full (${n}/${target.capacity}). Increase its capacity or choose another class.`);
  }
  const yr = activeYear();
  if (existing) {
    const classChanged = existing.classId !== data.classId;
    Object.assign(existing, data);
    if (photo) existing.photo = photo;
    if (yr && classChanged) { const e = enrolmentOf(existing.id, yr.id); if (e) e.classId = data.classId; }
    commit('Learner record updated', `${data.fullName} · ${data.regNumber}`);
  } else {
    const st = { id: uid('stu'), schoolId: sid(), ...data, photo: photo || '', createdAt: nowISO() };
    db.students.push(st);
    if (yr) db.enrolments.push({ id: uid('enr'), schoolId: sid(), studentId: st.id, yearId: yr.id, classId: st.classId, status: data.status === 'Active' ? 'enrolled' : data.status === 'Completed' ? 'completed' : 'transferred' });
    commit('Learner registered', `${data.fullName} · ${data.regNumber}`);
  }
  return true;
};

ACTIONS['student-delete'] = async el => {
  requireWritable();
  requireFeature('students');
  const st = byId('students', el.dataset.id);
  const nRes = db.results.filter(r => r.studentId === st.id).length;
  const nAtt = db.attendance.filter(a => a.studentId === st.id).length;
  const nRep = db.reportCards.filter(r => r.studentId === st.id).length;
  const ok = await confirmDialog(`Permanently delete <strong>${esc(st.fullName)}</strong> (${esc(st.regNumber)})? This also removes ${nRes} result(s), ${nAtt} attendance record(s) and ${nRep} saved report card(s). To keep history, change the status to Transferred or Withdrawn instead.`, { title: 'Delete learner record', ok: 'Delete permanently', danger: true });
  if (!ok) return;
  const id = st.id;
  db.results = db.results.filter(r => r.studentId !== id);
  db.attendance = db.attendance.filter(a => a.studentId !== id);
  db.enrolments = db.enrolments.filter(e => e.studentId !== id);
  db.promotions = db.promotions.filter(p => p.studentId !== id);
  db.reportCards = db.reportCards.filter(r => r.studentId !== id);
  db.reportNotes = db.reportNotes.filter(r => r.studentId !== id);
  db.students = db.students.filter(s => s.id !== id);
  if (ui.page === 'student') location.hash = '#students';
  commit('Learner record deleted', `${st.fullName} · ${st.regNumber}`);
};

function studentTabHtml(st) {

    <div class="card"><div class="card-h"><div><h3>Promotion decisions</h3><p>Recorded by the start-of-year transition.</p></div></div><div class="table-wrap mt"><table class="tbl"><thead><tr><th>Year</th><th>From → To</th><th>Decision</th></tr></thead><tbody>${promos.map(p => `<tr><td>${esc(byId('academicYears', p.yearId).name)}</td><td>${esc(classNameOf(p.fromClassId))} → ${p.toClassId ? esc(classNameOf(p.toClassId)) : 'Completed'}</td><td>${badge(p.decision === 'promote' ? 'Promoted' : p.decision === 'repeat' ? 'Repeating' : 'Completed', p.decision === 'promote' ? 'ok' : p.decision === 'repeat' ? 'warn' : 'info')}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No promotion decisions yet.</td></tr>'}</tbody></table></div></div></div>`;
  }
  if (tab === 'assessments') {
    const rows = db.results.filter(r => r.studentId === st.id).map(r => ({ r, a: byId('assessments', r.assessmentId) })).filter(x => x.a).sort((x, y) => (x.a.date < y.a.date ? 1 : -1));
    const body = rows.map(({ r, a }) => {
      const area = byId('learningAreas', a.areaId);

      return `<tr><td class="nowrap">${fmtDate(a.date)}</td><td><strong>${esc(a.name)}</strong><span class="sub">${esc(classNameOf(a.classId))}</span></td><td>${esc(area ? area.name : '—')}</td><td class="small">${esc(byId('terms', a.termId) ? byId('terms', a.termId).name : '—')} · ${esc(byId('academicYears', a.yearId) ? byId('academicYears', a.yearId).name : '')}</td><td class="r num">${result}</td><td class="r num">${fmtPct(pct)}</td><td class="small">${esc(r.comment || '')}</td></tr>`;
    }).join('');
    return `<div class="card"><div class="card-h"><div><h3>Assessment history</h3><p>All recorded results across academic years and terms.</p></div></div><div class="table-wrap mt"><table class="tbl"><thead><tr><th>Date</th><th>Assessment</th><th>Learning area</th><th>Term · year</th><th class="r">Result</th><th class="r">%</th><th>Teacher comment</th></tr></thead><tbody>${body || '<tr><td colspan="7" class="muted">No assessment results yet.</td></tr>'}</tbody></table></div></div>`;
  }
  if (tab === 'attendance') {

    const summaries = termIds.map(tid => {

FORMS.transition = fd => {

  } else {

      rec = { id: uid('rs'), schoolId: sid(), assessmentId: asm.id, studentId: st.id, marks: null, rating: null, comment: '', updatedAt: nowISO() };

    rec.rating = asm.kind === 'competency' ? (rating || null) : null;
    rec.comment = comment;
    rec.updatedAt = nowISO();
    rec.updatedBy = currentAdmin().name;
    if (hasValue) saved += 1;

  commit('Results saved', `${asm.name} · ${area ? area.name : ''} · ${classNameOf(asm.classId)} (${saved} learners)`);

};
